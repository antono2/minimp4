name: Test

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  V_C_ERROR_BUG_REPORT_DISABLED: '1'

jobs:
  platforms:
    name: Current toolchain / ${{ matrix.os }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: tcc
            bootstrap: cc
          - os: ubuntu-24.04
            cc: gcc
            bootstrap: cc
          - os: windows-2022
            cc: tcc
            bootstrap: tcc
          - os: windows-2022
            cc: msvc
            bootstrap: msvc
          - os: macos-15
            cc: clang
            bootstrap: cc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: c0bb94990c4c2cd080b27b4e2cbc88a347c6bb4c
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: 1bf1afbd0423212c7555801f5c9c0f56cb8558ab
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ runner.os == 'Windows' && 'c2f1eaf22973877b336b8064271d725aa15a420a' || runner.os == 'macOS' && (runner.arch == 'ARM64' && '69ba759bc4ec12bff4098828b5464e99bd29954a' || '566b6dfdb843763533e2134423f75139b4285a03') || '60d606e37e6afe1ac5801fd88c55036a56b7caae' }}
          path: toolchain/v/thirdparty/tcc
      - name: Bootstrap the tested compiler on Unix
        if: runner.os != 'Windows'
        run: env -u VEXE make -C toolchain/v local=1
      - name: Bootstrap the tested compiler on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -${{ matrix.bootstrap }} --local
      - name: Verify compiler and bootstrap revisions
        shell: bash
        run: toolchain/v/v run source/.github/scripts/qualify_toolchain.vsh
      - name: Configure MSVC x64
        if: matrix.cc == 'msvc'
        uses: antono2/vulkan/.github/actions/setup-msvc@23ec75dc6015776f3012880148ca90e66f63010a
      - name: Test the native MP4 ABI and callbacks
        shell: bash
        env:
          TEST_CC: ${{ matrix.cc }}
        run: v -cc "$TEST_CC" -cflags '-DWIN32_LEAN_AND_MEAN' test source

  test:
    if: always()
    needs: [platforms]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported compiler configuration
        env:
          PLATFORM_RESULT: ${{ needs.platforms.result }}
        run: test "$PLATFORM_RESULT" = success
